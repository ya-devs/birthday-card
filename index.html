<!DOCTYPE html>

<html>

<head>
    <title>Happy Birthday!</title>

    <style>

        body{
            text-align:center;
            font-family: Arial;
            background-color: white;

        }

        .heart{
            color:deeppink;
            font-size: 180px;
            line-height: 1;
            margin: 50px auto;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {

            0% {
                tranform: scale(1);
            }

            20% {
                transform: scale(1.2);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.2);
            }

            100% { 
                transform: scale(1);
            }
        }

    </style>
</head>

<body>
    
<h1>Happy Birthday!</h1>

<div class="heart">&hearts;</div>

<p>
    To the most wonderful husband and baba.<br>
        We love you!
    
</p>

</body>

</html>
